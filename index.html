<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scheda Ale</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Scheda"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#d8232a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* VOICE everyday: a gym logbook that makes you want to fill it in
   IDEA competition weight plates: each training day wears a plate colour (red, blue, yellow)
   PICTURE the 4-week block board in the header, live exercise cards with load curves; in Progressi a climbing load chart
   COLOUR white / near-black ground, ink, plate red, plate blue, plate yellow, green only for gains
   TYPE Barlow Condensed 700 + Barlow
   LAYOUT colour header band: title left, block board right; cards in 2-3 columns; phone: one column, sticky save bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111213);--ink:light-dark(#151515,#f0efec);--mut:light-dark(#5f5f5b,#a6a5a0);--line:light-dark(#e3e2de,#2c2d30);--pan:light-dark(#f3f2ef,#1c1d20);--g1:light-dark(#d8232a,#ff5157);--g2:light-dark(#1d4ed8,#7393ff);--g3:light-dark(#f2b600,#ffc928);--g4:light-dark(#0e7490,#3cc4e0);--up:light-dark(#0c8a44,#3fd27f);--dn:light-dark(#bf3324,#ff7c6c)}
@supports not (color:light-dark(#000,#fff)){:root{--bg:#ffffff;--ink:#151515;--mut:#5f5f5b;--line:#e3e2de;--pan:#f3f2ef;--g1:#d8232a;--g2:#1d4ed8;--g3:#f2b600;--g4:#0e7490;--up:#0c8a44;--dn:#bf3324}@media(prefers-color-scheme:dark){:root{--bg:#111213;--ink:#f0efec;--mut:#a6a5a0;--line:#2c2d30;--pan:#1c1d20;--g1:#ff5157;--g2:#7393ff;--g3:#ffc928;--g4:#3cc4e0;--up:#3fd27f;--dn:#ff7c6c}}}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
html[data-v=g1]{--hd:var(--g1);--hf:#fff}
html[data-v=g2]{--hd:var(--g2);--hf:#fff}
html[data-v=g3]{--hd:var(--g3);--hf:#151515}
html[data-v=g4]{--hd:var(--g4);--hf:#fff}
html[data-v=pr]{--hd:var(--ink);--hf:var(--bg)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,4vw,env(safe-area-inset-left,0px));padding-right:max(16px,4vw,env(safe-area-inset-right,0px))}
.top{background:var(--hd);color:var(--hf);transition:background .35s;padding-top:env(safe-area-inset-top,0px)}
.top-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:22px 40px;align-items:end;padding-top:clamp(22px,4vw,44px);padding-bottom:16px}
h1{font-size:clamp(44px,6vw,66px)}
.sub{margin:8px 0 0;font-weight:500;opacity:.88}
.board{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:5px;font-size:13px}
.bh{font-weight:600;opacity:.85;text-align:center;align-self:center;padding:0 4px}
.cell{height:40px;border-radius:7px;background:color-mix(in srgb,var(--hf) 15%,transparent);display:flex;align-items:center;justify-content:center;gap:5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.on{background:var(--bg);color:var(--ink)}
.cell.nx{outline:2px dashed color-mix(in srgb,var(--hf) 70%,transparent);outline-offset:-3px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{color:inherit;text-decoration:none;font-weight:600;padding:10px 16px;border-radius:12px 12px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px;min-height:46px;flex:none}
.tab.cur{background:var(--bg);color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 30%,transparent)}
.dot.g1{background:var(--g1)}
.dot.g2{background:var(--g2)}
.dot.g3{background:var(--g3)}
.dot.g4{background:var(--g4)}
.banner{background:var(--pan);border-radius:14px;margin-top:18px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:15px}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px;padding:26px 0 18px}
h2{font-size:clamp(32px,4vw,44px)}
.meta{margin:6px 0 0;color:var(--mut)}
.btn{font:600 16px Barlow,sans-serif;min-height:46px;padding:0 20px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn:hover{opacity:.88}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;padding-bottom:30px}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.g1{--dc:var(--g1);--df:#fff}
.g2{--dc:var(--g2);--df:#fff}
.g3{--dc:var(--g3);--df:#151515}
.g4{--dc:var(--g4);--df:#fff}
.ct{display:flex;align-items:flex-start;gap:10px}
.no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--dc);color:var(--df);display:grid;place-items:center;font:700 17px "Barlow Condensed",sans-serif}
h3{font-size:24px;flex:1;padding-top:2px}
.sig{flex:none;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--pan);color:var(--mut);white-space:nowrap}
.sig.up{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.sig.low{background:color-mix(in srgb,var(--dn) 13%,transparent);color:var(--dn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px Barlow,sans-serif;padding:6px 10px;border-radius:8px;background:var(--pan);color:var(--ink);border:0;white-space:nowrap}
button.chip{cursor:pointer;min-height:34px;border:1.5px solid var(--line)}
.how{margin:0;font-size:15px;line-height:1.45}
.note{margin:0;color:var(--mut);font-size:15px}
.cm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:end;padding-top:10px;border-top:1px solid var(--line)}
.last{display:flex;flex-direction:column;gap:2px}
.kg{font:700 42px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.kg small{font-size:18px;color:var(--mut)}
.reps{font-size:14px;color:var(--mut);white-space:nowrap}
.dl{font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.dl.pos{color:var(--up)}
.dl.neg{color:var(--dn)}
.spark{width:100%;height:54px;display:block}
.spark .sl{fill:none;stroke:var(--dc);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.spark .sa{fill:color-mix(in srgb,var(--dc) 16%,transparent)}
.empty{margin:0;color:var(--mut);font-size:15px}
.hint{margin:0;font-size:14px;color:var(--mut)}
.log{background:var(--pan);border-radius:12px;padding:12px}
.lh,.lr{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.lh{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:6px}
.lr{margin-bottom:6px}
.sn{font:700 19px "Barlow Condensed",sans-serif;text-align:center}
input,select,textarea{font:500 16px Barlow,sans-serif;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
input::placeholder{color:color-mix(in srgb,var(--mut) 70%,transparent)}
textarea{padding:10px;min-height:90px}
input[inputmode],textarea{-webkit-appearance:none;appearance:none}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation}
input[type=date]{min-width:9.5em;line-height:44px}
.mini{font:600 14px Barlow,sans-serif;background:none;border:0;color:var(--ink);text-decoration:underline;padding:8px 0;cursor:pointer;min-height:40px}
.rules{border-top:1px solid var(--line);padding-top:26px;padding-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px 28px}
.rules h4{font-size:21px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.rules p{margin:0;font-size:15px;color:var(--mut)}
.foot{color:var(--mut);font-size:14px;padding-top:12px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.savebar{position:sticky;bottom:0;background:var(--ink);color:var(--bg);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.sb{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding-top:12px;padding-bottom:12px}
.sb label{display:grid;gap:2px;font-size:13px;font-weight:600}
.sb input,.sb select{width:auto;border:0;min-height:44px}
.sb .sp{flex:1;font-weight:600;align-self:center}
.live{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.live .meta{margin:0;max-width:32em}
.sb .btn{border-color:var(--bg);color:var(--bg)}
.sb .btn.pri{background:var(--bg);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:14px;padding:26px 0 20px}
.kpi{border-top:3px solid var(--ink);padding-top:8px}
.kpi b{display:block;font:700 clamp(34px,5vw,50px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{color:var(--mut);font-size:14px}
.pg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start;padding-bottom:30px}
.fig{position:relative;height:clamp(300px,38vw,420px);margin-top:12px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:14px Barlow,sans-serif;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
svg .gl{stroke:var(--line)}
svg .area{fill:color-mix(in srgb,var(--dc) 22%,transparent)}
svg .ln{fill:none;stroke:var(--dc);stroke-width:3;stroke-linejoin:round}
svg .e1{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 5;opacity:.55}
svg .pt{fill:var(--bg);stroke:var(--dc);stroke-width:3}
svg text.v{fill:var(--ink);font-weight:600}
.legend{font-size:14px;color:var(--mut);margin:8px 0 0}
.lg{font-size:20px;display:flex;gap:8px;align-items:center;margin:18px 0 4px}
.lg:first-child{margin-top:0}
.exr{text-decoration:none;display:grid;grid-template-columns:minmax(0,1fr) auto 60px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px;color:var(--ink);font:500 15px Barlow,sans-serif;cursor:pointer;min-height:50px;border-radius:8px}
.exr.sel{background:var(--pan)}
.exr .spark{height:28px}
.ev{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.ev .dl{margin-left:6px}
.hist{border-top:1px solid var(--line);margin-top:8px}
.hr{display:grid;grid-template-columns:80px 46px 64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.tag{font:700 14px "Barlow Condensed",sans-serif;background:var(--dc);color:var(--df);border-radius:6px;padding:2px 0;text-align:center}
.ha{display:flex;gap:6px;justify-content:flex-end}
.ha button{font:600 14px Barlow,sans-serif;min-height:38px;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.ha button.warn{border-color:var(--dn);color:var(--dn)}
.ha em{color:var(--mut);font-size:14px}
details{margin-top:24px}
summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.bk{display:grid;gap:10px;max-width:560px;padding-top:8px}
.bk div{display:flex;gap:10px;flex-wrap:wrap}
#timer{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 6px 6px 18px;display:flex;gap:12px;align-items:center;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#timer[hidden]{display:none}
#timer b{font:700 28px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;min-width:3.2ch}
#timer.done{background:var(--up);color:#fff}
#timer button{width:44px;height:44px;border-radius:50%;border:0;background:color-mix(in srgb,var(--bg) 20%,transparent);color:inherit;font:600 18px Barlow,sans-serif;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100vw - 32px)}
#toast[hidden]{display:none}
.bform{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px;background:var(--pan);border-radius:16px;padding:16px;margin-bottom:18px}
.bform label{display:grid;gap:4px;font-size:14px;font-weight:600}
.bform .full{grid-column:1/-1;margin:0;font-size:14px;color:var(--mut);font-weight:400}
.mv{font:700 42px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv small{font-size:18px;color:var(--mut)}
.br{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
@media(max-width:820px){.pg{grid-template-columns:minmax(0,1fr)}}
@media(min-width:821px){.chartbox{position:sticky;top:12px}}
@media(max-width:700px){.top-in{grid-template-columns:minmax(0,1fr)}.hr{grid-template-columns:70px 42px minmax(0,1fr) auto}.hr .hw{display:none}}
@media(max-width:600px){.sb{flex-wrap:nowrap;gap:8px;padding-top:10px;padding-bottom:10px}.sb .sp{display:none}.sb label:first-of-type{flex:1}.sb input[type=date]{width:100%;min-width:0}.hv{display:none}.tabs{gap:0}.tab{padding:10px 11px;font-size:15px}.tab .dot{display:none}.cell{height:34px;font-size:12px}.cell .dot{display:none}.kg{font-size:38px}.sb .sp{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){.top{transition:none}}
</style></head>
<body>
<div id="root"></div>
<script id="app">
{
const LS='scheda-ale-v1',LSD='scheda-ale-draft',LSB='scheda-ale-backup';
const RAW=[
 [['c1','Chest press',90,8,10,9,''],['c2','Incline chest press',90,8,8,9,''],['c3','Lat machine presa stretta',90,8,8,9,''],['c4','Low row (peso per lato)',90,8,10,9,''],['c5','Push down corda',90,8,10,9,''],['c6','Curl a martello',90,8,10,9,'']],
 [['d1','Lat machine presa stretta',90,8,10,9,''],['d2','Pulley',-1,8,8,9,''],['d3','Spinte panca 45° manubri',90,8,10,9,''],['d4','Croci panca 30° manubri',90,10,12,9,''],['d5','Spider curl',60,10,12,9,''],['d6','Push down cavo alto',0,10,12,9,'Recupero non indicato in scheda']],
 [['e1','Leg curl alla leg extension',90,10,12,9,''],['e2','Hip thrust machine',90,10,10,9,''],['e3','Squat bulgari',90,10,10,9,'10 per gamba'],['e4','Leg press',90,12,12,10,'@10 = a cedimento'],['e5','Spinte panca 60° manubri',90,8,8,9,''],['e6','Alzate laterali manubri',90,10,12,9,'']]
];
const DAYS=RAW.map((l,i)=>({d:i+1,c:'g'+(i+1),ex:l.map(([id,n,rest,min,max,rpe,note])=>({id,n,rest,min,max,rpe,note,sets:4,db:/manubri|bulgari|spider|curl panca|martello/i.test(n)}))}));
const HOW={"c1": "Schiena incollata allo schienale: spingi le maniglie avanti fino a braccia quasi tese, torna lento.", "c2": "Chest press con schienale inclinato: spingi in alto e avanti, scapole strette. Lavora il petto alto.", "c3": "Triangolo, petto in fuori: tira verso lo sterno portando i gomiti giù vicino ai fianchi.", "c4": "Petto sul supporto: tira le maniglie verso l'addome stringendo le scapole, senza strappi.", "c5": "Cavo alto, gomiti fermi ai fianchi: spingi giù fino a braccia tese aprendo la corda in fondo.", "c6": "Manubri con i palmi verso il corpo: piega i gomiti tenendoli fermi ai fianchi, senza dondolare.", "d1": "Triangolo, petto in fuori: tira verso lo sterno portando i gomiti giù vicino ai fianchi.", "d2": "Cavo basso con il triangolo, schiena dritta: tira verso l'addome stringendo le scapole.", "d3": "Panca a 45°: spingi i manubri dal petto verso l'alto fino a farli quasi toccare.", "d4": "Panca a 30°, gomiti appena piegati: chiudi le braccia ad arco sopra il petto, riapri lento.", "d5": "Sdraiato a pancia in giù sulla panca a 30°, braccia a penzoloni: curl senza muovere i gomiti.", "d6": "Gomiti fermi ai fianchi: spingi giù fino a braccia tese, risali senza alzare i gomiti.", "e1": "In piedi, step sotto al piede d'appoggio, rullo dietro la caviglia: porta il tallone al gluteo.", "e2": "Schiena sul supporto, piedi larghi come le anche: spingi su il bacino. Focus sulla contrazione dei glutei.", "e3": "Piede dietro sulla panca: scendi col ginocchio dietro verso terra, risali spingendo sul tallone.", "e4": "Piedi larghi come le spalle: porta le ginocchia verso il petto, spingi senza bloccarle in fondo.", "e5": "Panca a 60°, manubri alle spalle: spingi sopra la testa. Lavora spalle e petto alto.", "e6": "In piedi o seduto, come preferisci. Gomiti appena piegati: alza di lato fino alle spalle, scendi lento."};
const EX={};DAYS.forEach(D=>D.ex.forEach(e=>{e.day=D;EX[e.id]=e}));
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=x=>(Math.round(x*100)/100).toLocaleString('it-IT',{maximumFractionDigits:2});
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});
const fmtS=d=>d.slice(8,10)+'/'+d.slice(5,7);
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const restTxt=s=>s<0?'completo':!s?'—':(Math.floor(s/60)?Math.floor(s/60)+'′':'')+(s%60?String(s%60).padStart(2,'0')+'″':'');
const repTxt=e=>e.sets+' × '+(e.min===e.max?e.min:e.min+'–'+e.max);
const sample=()=>{
 const base={c1:60,c2:50,c3:60,c4:30,c5:22.5,c6:12,d1:55,d2:55,d3:24,d4:12,d5:10,d6:27.5,e1:25,e2:90,e3:14,e4:160,e5:22,e6:8};
 const plan=[[1,'2026-11-09',1,0],[2,'2026-11-11',1,0],[3,'2026-11-13',1,0],[1,'2026-11-16',2,1],[2,'2026-11-18',2,1],[3,'2026-11-20',2,1],[1,'2026-11-23',3,2]];
 return{v:1,savedAt:0,sessions:plan.map(([d,date,w,k],j)=>{const sets={};for(const e of DAYS[d-1].ex){const kg=base[e.id]+(k>=2?(e.db?2:2.5):0);const R=k===1?[e.max,e.max,e.max,e.max]:k===0?[e.max,e.max-1,Math.max(e.min,e.max-2),e.min]:[e.max,Math.min(e.max,e.min+1),e.min,e.min];sets[e.id]=R.map(r=>[kg,Math.max(1,r)])}return{id:'x'+j,ts:j,date,day:d,week:w,sample:true,sets}})};
};
let emb=null,loc=null;
try{loc=JSON.parse(localStorage.getItem(LS))}catch(e){}
let st=(loc&&Array.isArray(loc.sessions)&&loc.savedAt>((emb&&emb.savedAt)||0))?loc:emb;

const saveBar=()=>{const D=DAYS[logging.day-1];return`<div class="savebar"><div class="wrap sb"><span class="sp">${logging.edit?'Modifica':'Seduta'} Giorno ${D.d}</span><label>Data<input type="date" id="f-date"></label><label>Settimana<select id="f-week">${[1,2,3,4].map(w=>`<option value="${w}">${w}</option>`).join('')}</select></label><button class="btn pri" data-act="save" type="button">Salva</button></div></div>`};
const lastBk=()=>{try{return+localStorage.getItem(LSB)||0}catch(e){return 0}};
const foot=()=>`<footer class="wrap foot">Le sedute sono salvate su questo telefono, anche senza connessione. ${lastBk()?'Ultimo backup: '+new Date(lastBk()).toLocaleDateString('it-IT',{day:'numeric',month:'short'})+'.':'Nessun backup ancora.'} Versione 11.</footer>`;
const ro=new ResizeObserver(()=>drawBig());
const drawBig=()=>{const s=$('#big'),t=$('#ch-t');if(!s||!sel)return;const W=s.clientWidth,H=s.clientHeight,e=EX[sel],h=hist(sel);
 if(!h.length){t.textContent=e.n+': ancora nessun dato';s.innerHTML='';return}
 const d=h[h.length-1].top-h[0].top;t.textContent=h.length>1?e.n+': '+(d>0?'+':'')+fmtN(d)+' kg in '+h.length+' sedute':e.n+': prima seduta a '+fmtN(h[0].top)+' kg';
 const nar=W<520,m={l:42,r:nar?18:118,t:30,b:30};
 let lo=Math.min(...h.map(x=>x.top)),hi=Math.max(...h.map(x=>x.e1));const pad=Math.max((hi-lo)*.2,2);lo=Math.max(0,lo-pad);hi=hi+pad;
 const step=[1,2,2.5,5,10,20,25,50].find(q=>(hi-lo)/q<=5)||100;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
 const iw=W-m.l-m.r,X=i=>m.l+(h.length===1?iw/2:i/(h.length-1)*iw),Y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b);
 let g='';for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-8}" y="${Y(v)+5}" text-anchor="end">${fmtN(v)}</text>`;
 const p=h.map((x,i)=>X(i)+' '+Y(x.top)).join('L'),q=h.map((x,i)=>X(i)+' '+Y(x.e1)).join('L');
 g+=h.length>1?`<path class="area" d="M${p}L${X(h.length-1)} ${H-m.b}L${X(0)} ${H-m.b}Z"/><path class="ln" d="M${p}"/><path class="e1" d="M${q}"/>`:'';
 const lab=nar?[0,h.length-1]:h.map((_,i)=>i);
 h.forEach((x,i)=>{g+=`<circle class="pt" cx="${X(i)}" cy="${Y(x.top)}" r="5"/>`;if(lab.includes(i)||h.length<=8)g+=`<text class="v" x="${X(i)}" y="${Y(x.top)-12}" text-anchor="middle">${fmtN(x.top)}</text>`;if(lab.includes(i)&&(h.length<=10||i%2===0||i===h.length-1))g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${fmtS(x.date)}</text>`});
 const z=h[h.length-1];if(!nar)g+=`<text x="${X(h.length-1)+12}" y="${Y(z.top)+5}">kg top</text><text x="${X(h.length-1)+12}" y="${Y(z.e1)+5}">1RM ~${fmtN(Math.round(z.e1))}</text>`;
 s.innerHTML=g};
const fill=()=>{for(const o of [dv,bv])for(const k in o){const el=document.getElementById(k);if(el)el.value=o[k]}};
const saveDraft=()=>{try{(logging||blog)?localStorage.setItem(LSD,JSON.stringify({logging,dv,blog,bv})):localStorage.removeItem(LSD)}catch(e){}};
const render=()=>{const v=view(),D=v.startsWith('giorno-')?DAYS[+v.slice(-1)-1]:null,B=v==='cyclette';
 document.documentElement.dataset.v=D?D.c:B?'g4':'pr';
 $('#root').innerHTML=header(v)+banner()+(D?dayView(D):B?bikeView():progView())+foot()+(B&&blog?bikeBar():logging?saveBar():'');
 {const m=document.querySelector('meta[name=theme-color]'),t=$('.top');if(m&&t)m.content=getComputedStyle(t).backgroundColor}
 if(logging||blog)fill();ro.disconnect();const f=$('.fig');if(f){ro.observe(f);drawBig()}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)};
const persist=m=>{st.savedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(st));toast(m)}catch(e){toast('Errore di salvataggio: fai un backup')}render()};
const openLog=(d,edit)=>{logging={day:d,edit:edit||null};dv={'f-date':today(),'f-week':String(nextWeek(d))};
 const s=edit&&st.sessions.find(x=>x.id===edit);if(s){dv['f-date']=s.date;dv['f-week']=String(s.week);for(const id in s.sets)s.sets[id].forEach((x,i)=>{dv['k-'+id+'-'+i]=String(x[0]).replace('.',',');dv['r-'+id+'-'+i]=String(x[1])})}
 saveDraft();if(location.hash!=='#giorno-'+d)location.hash='giorno-'+d;else render();scrollTo(0,0)};
const save=()=>{const D=DAYS[logging.day-1],out={};
 for(const e of D.ex){const h=hist(e.id,logging.edit,true),L=h[h.length-1],arr=[];
  for(let i=0;i<e.sets;i++){const r=parseInt(dv['r-'+e.id+'-'+i]||'',10);let k=parseFloat(String(dv['k-'+e.id+'-'+i]||'').replace(',','.'));if(!(r>0))continue;if(!(k>=0)){if(arr.length)k=arr[arr.length-1][0];else if(L)k=L.ss[i]?L.ss[i][0]:L.top;else continue}arr.push([k,r])}
  if(arr.length)out[e.id]=arr}
 if(!Object.keys(out).length){toast('Inserisci almeno una serie con le ripetizioni');return}
 const date=dv['f-date']||today(),week=+(dv['f-week']||1);
 st.sessions=st.sessions.filter(s=>!s.sample);
 const s=logging.edit&&st.sessions.find(x=>x.id===logging.edit);
 if(s){s.sets=out;s.date=date;s.week=week}else st.sessions.push({id:'s'+Date.now().toString(36),ts:Date.now(),date,day:D.d,week,sets:out});
 logging=null;dv={};saveDraft();persist(s?'Seduta aggiornata':'Seduta salvata')};
const markBk=()=>{try{localStorage.setItem(LSB,String(Date.now()))}catch(e){}};
const readImp=()=>{const f=$('#impf')&&$('#impf').files[0];return f?f.text():Promise.resolve($('#imp').value)};
const backup=async()=>{const name='scheda-ale-backup-'+today()+'.json',blob=new Blob([JSON.stringify(st)],{type:'application/json'});
 try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Scheda Ale'});markBk();toast('Backup pronto');render();return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);markBk();toast('Backup scaricato');render()};
const startRest=sec=>{clearInterval(tmr);const end=Date.now()+sec*1000,el=$('#timer');el.hidden=false;const tick=()=>{const l=Math.max(0,Math.round((end-Date.now())/1000));el.querySelector('b').textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');el.classList.toggle('done',!l);if(!l)clearInterval(tmr)};tick();tmr=setInterval(tick,250)};
const ui=document.createElement('div');ui.innerHTML='<div id="timer" hidden role="timer" aria-live="off"><span>Recupero</span><b>0:00</b><button type="button" data-act="stop" aria-label="Chiudi timer">✕</button></div><div id="toast" hidden role="status"></div>';document.body.append(...ui.children);
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act],[data-rest],[data-fill],[data-ex],[data-edit],[data-del],[data-bedit],[data-bdel]');if(!t)return;const a=t.dataset;
 if(a.bedit)return openBike(a.bedit);
 if(a.bdel){if(pend===a.bdel){st.bike=st.bike.filter(s=>s.id!==a.bdel);pend=null;persist('Seduta eliminata')}else{pend=a.bdel;render()}return}
 if(a.rest)return startRest(+a.rest);
 if(a.ex){sel=a.ex;return render()}
 if(a.edit){const s=st.sessions.find(x=>x.id===a.edit);if(s)openLog(s.day,s.id);return}
 if(a.del){if(pend===a.del){st.sessions=st.sessions.filter(s=>s.id!==a.del);pend=null;persist('Seduta eliminata')}else{pend=a.del;render()}return}
 if(a.fill){const h=hist(a.fill,logging&&logging.edit,true),L=h[h.length-1];if(L){L.ss.forEach((x,i)=>{dv['k-'+a.fill+'-'+i]=String(x[0]).replace('.',',');dv['r-'+a.fill+'-'+i]=String(x[1])});saveDraft();fill()}return}
 const act=a.act;
 if(act==='log')openLog(+a.d);
 else if(act==='cancel'){logging=null;dv={};saveDraft();render()}
 else if(act==='save')save();
 else if(act==='blog')openBike();
 else if(act==='bcancel'){blog=null;bv={};saveDraft();render()}
 else if(act==='bsave')saveBike();
 else if(act==='stop'){clearInterval(tmr);$('#timer').hidden=true}
 else if(act==='clearsample'){st.sessions=st.sessions.filter(s=>!s.sample);persist('Esempi cancellati')}
 else if(act==='copy'){navigator.clipboard.writeText(JSON.stringify(st)).then(()=>{markBk();toast('Backup copiato')},()=>toast('Copia non riuscita'))}
 else if(act==='dl')backup();
 else if(act==='import')readImp().then(txt=>{try{const o=JSON.parse(txt);if(!o||!Array.isArray(o.sessions))throw 0;st={v:1,savedAt:0,sessions:o.sessions.filter(s=>s&&s.sets&&s.date&&s.day),bike:Array.isArray(o.bike)?o.bike.filter(s=>s&&s.date&&s.min>0):[]};persist('Dati importati')}catch(e){toast('Backup non valido')}});
});
const onIn=ev=>{const t=ev.target;if(!t.id)return;if(logging&&/^(k-|r-|f-)/.test(t.id)){dv[t.id]=t.value;saveDraft()}else if(blog&&/^b-/.test(t.id)){bv[t.id]=t.value;saveDraft()}};
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
addEventListener('hashchange',()=>{pend=null;render()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){const had=!!navigator.serviceWorker.controller;let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});navigator.serviceWorker.register('sw.js').then(r=>{r.update();addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{})}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
</script>
</body>
</html>
